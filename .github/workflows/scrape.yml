name: Sincronizar partidos · Federación Tinerfeña

on:
  # Cada 6 horas, en punto (UTC). Equivale a 02:00, 08:00, 14:00, 20:00 hora canaria
  # y 03:00, 09:00, 15:00, 21:00 hora peninsular.
  schedule:
    - cron: "0 */6 * * *"

  # Permite lanzarlo a mano desde la UI de GitHub
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scraper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scrape
